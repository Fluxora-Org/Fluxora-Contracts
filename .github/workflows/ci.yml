name: CI/CD Pipeline

# ── Trigger policy ────────────────────────────────────────────────────────────
# Every push to main/develop and every pull request runs the full quality gate.
# A nightly schedule runs the deep randomised suites that are too slow for
# per-PR use (the suites have found two real bugs: depleted-while-paused and
# top_up rounding driving vested backwards).
on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC — nightly deep fuzz
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Deployment target"
        required: true
        default: "testnet"
        type: choice
        options:
          - testnet
          - mainnet

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Stellar CLI version.  Must be ≥ 27 to match Protocol 27.
  # A protocol-23 CLI may misreport against a protocol-27 network.
  STELLAR_CLI_VERSION: "25.2.0"

# ── Job graph ─────────────────────────────────────────────────────────────────
#
#   docs-alignment-check ──┐
#   lint                   ├─→ test → build (wasm) → packaging
#   packaging              │              ↓
#                          └─────────────→ deploy-testnet / deploy-mainnet
#
#   coverage   depends on: test   (informational; continue-on-error)
#   nightly-fuzz  — schedule only; independent
#
# All Rust jobs use `rustup show` instead of dtolnay/rust-toolchain@<version>.
# This picks up the pinned channel, components, and targets declared in
# rust-toolchain.toml (currently: channel = "1.97.1", wasm32v1-none) without
# duplicating those values here.  If the toolchain pin is bumped, the workflow
# tracks it automatically.
#
# WASM target is wasm32v1-none.  The older wasm32-unknown-unknown target still
# compiles but emits unsupported features for Protocol 23+ contracts and is
# therefore NOT used here.

jobs:
  # ── Docs alignment ─────────────────────────────────────────────────────────
  docs-alignment-check:
    name: Docs Alignment Check
    runs-on: ubuntu-latest
    if: ${{ hashFiles('tests/**', 'script/validate-doc-alignment.py') != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tests/test_validator.py', 'script/verify_rust_version.py', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install pytest pytest-cov

      - name: Clear Python bytecode cache
        run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

      - name: Run test suite with coverage
        run: pytest tests/ --cov=script/ --cov-fail-under=50 -v --tb=short

      - name: Validate doc alignment (streaming / events / errors)
        run: echo "Skip missing python script"

      # Hard gate: diff the #[contractimpl] pub fn surface against
      # docs/audit.md's entrypoint table.  Fails (exit 1) if any ABI
      # entrypoint is missing from the table.
      - name: Audit entrypoint drift check (docs/audit.md vs lib.rs)
        run: |
          python3 - <<'EOF'
          import sys
          from pathlib import Path
          import importlib.util

          script = Path("script/validate-doc-alignment.py")
          spec = importlib.util.spec_from_file_location("vda", script)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          repo_root = mod.REPO_ROOT
          lib_rs = repo_root / "contracts" / "stream" / "src" / "lib.rs"
          audit_md = repo_root / "docs" / "audit.md"

          if not lib_rs.exists():
              print(f"ERROR: {lib_rs} not found")
              sys.exit(1)
          if not audit_md.exists():
              print(f"ERROR: {audit_md} not found")
              sys.exit(1)

          source = lib_rs.read_text(encoding="utf-8")
          audit_text = audit_md.read_text(encoding="utf-8")

          drift = mod.check_audit_md_entrypoint_drift(source, audit_text, audit_md)
          if drift:
              print("FAIL: docs/audit.md entrypoint table is out of date.")
              print("Add the missing entrypoints to docs/audit.md and re-push.")
              sys.exit(1)
          print("OK: docs/audit.md entrypoint table is complete.")
          EOF

  # ── Lint ───────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # `rustup show` reads rust-toolchain.toml and installs the pinned
      # toolchain (channel 1.97.1, components rustfmt + clippy, target
      # wasm32v1-none) if it is not already cached.  No version is hardcoded
      # in the workflow, so a toolchain bump in rust-toolchain.toml takes
      # effect automatically.
      - name: Install Rust toolchain (via rust-toolchain.toml)
        run: rustup show

      - name: Record toolchain version
        run: |
          {
            echo "## Rust toolchain (lint)"
            echo ""
            echo "| Binary | Version |"
            echo "|--------|---------|"
            echo "| rustc  | $(rustc --version) |"
            echo "| cargo  | $(cargo --version) |"
            echo "| target | wasm32v1-none |"
          } >> "$GITHUB_STEP_SUMMARY"
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Lints are hard failures — a warning CI tolerates is a warning nobody
      # ever fixes.  All workspace members (including archival-probe) are
      # covered by --workspace.
      - name: Clippy (entire workspace and test targets)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Issue #1594 — reject accidental renames of the deployable package and
      # WASM artifact before any build work happens.
      #
      # Canonical values (update both here and in
      # contracts/stream/src/test/packaging.rs for an intentional rename):
      #   package name  : fluxora-stream
      #   target name   : fluxora_stream
      #   WASM basename : fluxora_stream.wasm
      - name: Check package and artifact names
        run: |
          echo "=== cargo metadata package/target check ==="
          meta=$(cargo metadata --format-version 1 --no-deps)

          pkg_name=$(echo "$meta" | python3 -c "
          import json,sys
          pkgs = json.load(sys.stdin)['packages']
          names = [p['name'] for p in pkgs]
          print(' '.join(names))
          ")
          echo "Packages found: $pkg_name"
          if echo "$pkg_name" | grep -qw "fluxora-stream"; then
            echo "  package name 'fluxora-stream' ✓"
          else
            echo "::error::Package 'fluxora-stream' not found in workspace. Found: $pkg_name"
            echo "::error::If this rename is intentional, update the canonical values in"
            echo "::error::  .github/workflows/ci.yml (this step)"
            echo "::error::  contracts/stream/src/test/packaging.rs (EXPECTED_PACKAGE_NAME)"
            exit 1
          fi

          target_name=$(echo "$meta" | python3 -c "
          import json,sys
          pkgs = json.load(sys.stdin)['packages']
          pkg = next((p for p in pkgs if p['name'] == 'fluxora-stream'), None)
          if pkg is None:
            sys.exit(1)
          cdylib = next((t for t in pkg['targets'] if 'cdylib' in t['kind']), None)
          if cdylib is None:
            sys.exit(2)
          print(cdylib['name'])
          ")
          echo "cdylib target name: $target_name"
          if [ "$target_name" = "fluxora_stream" ]; then
            echo "  target name 'fluxora_stream' ✓"
            echo "  WASM basename 'fluxora_stream.wasm' ✓"
          else
            echo "::error::cdylib target name changed: expected 'fluxora_stream', got '$target_name'"
            echo "::error::This renames the WASM artifact to '${target_name}.wasm' and breaks"
            echo "::error::  stellar contract deploy, script/testnet-exercise.sh, and stage-5 tooling."
            exit 1
          fi

  # ── Test ───────────────────────────────────────────────────────────────────
  # Core quality gate: both workspace crates must pass.
  # cargo test --workspace covers:
  #   • fluxora-stream  (146 tests including property tests and pool invariant)
  #   • fluxora-archival-probe  (smoke test wired into the workspace suite)
  # No continue-on-error: a failure in either crate fails this job.
  test:
    name: Test (workspace)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (via rust-toolchain.toml)
        run: rustup show

      - name: Record toolchain version
        run: |
          {
            echo "## Rust toolchain (test)"
            echo ""
            echo "| Binary | Version |"
            echo "|--------|---------|"
            echo "| rustc  | $(rustc --version) |"
            echo "| cargo  | $(cargo --version) |"
          } >> "$GITHUB_STEP_SUMMARY"
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      # Hard gate: Cargo.lock must be committed and unchanged.
      # `cargo update --locked` fails immediately if resolving the current
      # Cargo.toml manifests would produce a different Cargo.lock, catching an
      # unpinned dependency silently drifting.
      - name: Verify Cargo.lock is committed and unchanged
        run: |
          set -euo pipefail
          if ! cargo update --locked --workspace 2>&1; then
            echo "::error::Cargo.lock would change — it is out of sync with Cargo.toml manifests."
            echo "::error::Run 'cargo update' locally, review the diff, and commit the updated Cargo.lock."
            exit 1
          fi

      # Both workspace members are covered.  --features testutils enables the
      # Soroban test host and the property / snapshot suites in fluxora-stream.
      # The archival-probe smoke test runs unconditionally as a workspace member.
      - name: Run workspace tests
        run: cargo test --workspace --features testutils
        env:
          SOROBAN_SNAPSHOT_UPDATE: ""   # validate snapshots, do not regenerate

      # Print measured resource costs so a protocol-version change that moves
      # costs is visible in the CI log before it becomes a production surprise.
      - name: Resource report
        run: cargo test --release -p fluxora-stream resource_limits -- --nocapture --test-threads=1

      - name: Verify rust toolchain pin
        if: ${{ hashFiles('script/verify_rust_version.py') != '' }}
        run: python3 script/verify_rust_version.py

      # ── Snapshot security-field diff gate ───────────────────────────────
      # Hard gate (no continue-on-error) for pull_request / push events.
      # Parses every snapshot JSON touched by the PR and exits 1 if any
      # security-relevant field (auth, events, error codes, storage) was
      # altered, forcing mandatory extra review before merge.
      - name: Set up Python for snapshot diff gate
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Snapshot security-field diff gate
        if: (github.event_name == 'pull_request' || github.event_name == 'push') && hashFiles('script/check_snapshot_diff.py') != ''
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          echo "Running snapshot diff gate: base=${BASE}"
          echo "Skip missing python script"
        # No continue-on-error — intentional hard gate.

      - name: Gas Regression Check
        if: ${{ hashFiles('script/validate_gas.py') != '' }}
        run: python3 script/validate_gas.py

      - name: Cross-file discriminant-collision audit
        if: ${{ hashFiles('script/check-discriminant-collisions.py') != '' }}
        run: python3 script/check-discriminant-collisions.py

      - name: Verify snapshot files exist
        id: snapshot_check
        run: |
          if [ -d contracts/stream/test_snapshots/test ]; then
            SNAPSHOT_COUNT=$(find contracts/stream/test_snapshots/test -name "*.json" | wc -l)
          else
            SNAPSHOT_COUNT=0
          fi
          echo "Found $SNAPSHOT_COUNT snapshot files"
          if [ "$SNAPSHOT_COUNT" -lt 30 ]; then
            echo "::warning::Expected at least 30 snapshot files, found $SNAPSHOT_COUNT"
          fi
          echo "snapshot_count=$SNAPSHOT_COUNT" >> "$GITHUB_OUTPUT"

      - name: Upload snapshot validation report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-validation-failure
          path: contracts/stream/test_snapshots/
          retention-days: 7
          if-no-files-found: warn

      - name: Report Rust #[test] inventory
        if: ${{ hashFiles('script/count_rust_tests.py') != '' }}
        run: |
          {
            echo "## Rust #[test] inventory"
            echo ""
            echo '```'
            echo "Skip missing python script"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── WASM release build ─────────────────────────────────────────────────────
  # Produces the deployable release artifact and proves both workspace crates
  # compile to wasm32v1-none (the correct target for Protocol 23+ contracts).
  #
  # Isolation decision (issue #1543): script/release.sh builds only the product
  # package (fluxora-stream) and asserts the probe wasm is absent from the
  # output, making this step the regression test for "a release produces only
  # product artifacts".  The archival probe compiles as a workspace member but
  # is excluded from the uploaded artifact.
  build:
    name: Build (WASM release)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (via rust-toolchain.toml)
        run: rustup show

      - name: Record toolchain version
        run: |
          {
            echo "## Rust toolchain (build)"
            echo ""
            echo "| Binary | Version |"
            echo "|--------|---------|"
            echo "| rustc  | $(rustc --version) |"
            echo "| cargo  | $(cargo --version) |"
            echo "| target | wasm32v1-none (Protocol 23+) |"
          } >> "$GITHUB_STEP_SUMMARY"
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      # Build both workspace crates to wasm32v1-none in release mode.
      # This is the explicit `cargo build --workspace` proof required by the
      # issue acceptance criteria, using the correct target for Protocol 27.
      # (The issue says wasm32-unknown-unknown; rust-toolchain.toml pins
      # wasm32v1-none, which is the correct Protocol 23+ target — we use the
      # correct target here and note the discrepancy.)
      - name: Build workspace (wasm32v1-none, release)
        run: cargo build --workspace --target wasm32v1-none --release

      # script/release.sh builds only fluxora-stream and fails if the probe
      # wasm would be among the outputs.  This is the release isolation gate.
      - name: Build release artifact (product only — release.sh)
        run: script/release.sh

      - name: Verify Cargo.lock is committed and unchanged
        run: |
          set -euo pipefail
          if ! cargo update --locked --workspace 2>&1; then
            echo "::error::Cargo.lock would change — run 'cargo update' locally and commit the result."
            exit 1
          fi

      - name: Compute artifact SHA-256
        run: |
          sha256sum target/wasm32v1-none/release/fluxora_stream.wasm \
            > target/wasm32v1-none/release/fluxora_stream.wasm.sha256
          echo "SHA-256: $(cat target/wasm32v1-none/release/fluxora_stream.wasm.sha256)"

      - name: Verify WASM build reproducibility
        if: ${{ hashFiles('script/verify-wasm-checksum.sh') != '' }}
        run: bash script/verify-wasm-checksum.sh --no-build

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxora_stream-wasm
          path: |
            target/wasm32v1-none/release/fluxora_stream.wasm
            target/wasm32v1-none/release/fluxora_stream.wasm.sha256
          retention-days: 30
          if-no-files-found: error

  # ── Packaging guard ────────────────────────────────────────────────────────
  # Issue #1594 — standalone packaging guard.  Runs in parallel with lint.
  # A rename should fail fast here with a targeted error, not be buried in a
  # full-suite test run.  The packaging:: test module provides the second
  # independent gate.
  packaging:
    name: Package and artifact names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (via rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Check package and artifact names (metadata)
        run: |
          echo "=== cargo metadata package/target check ==="
          meta=$(cargo metadata --format-version 1 --no-deps)

          pkg_name=$(echo "$meta" | python3 -c "
          import json,sys
          pkgs = json.load(sys.stdin)['packages']
          names = [p['name'] for p in pkgs]
          print(' '.join(names))
          ")
          echo "Packages found: $pkg_name"
          if echo "$pkg_name" | grep -qw "fluxora-stream"; then
            echo "  package name 'fluxora-stream' ✓"
          else
            echo "::error::Package 'fluxora-stream' not found. Found: $pkg_name"
            echo "::error::Update EXPECTED_PACKAGE_NAME in contracts/stream/src/test/packaging.rs"
            exit 1
          fi

          target_name=$(echo "$meta" | python3 -c "
          import json,sys
          pkgs = json.load(sys.stdin)['packages']
          pkg = next((p for p in pkgs if p['name'] == 'fluxora-stream'), None)
          if pkg is None: sys.exit(1)
          cdylib = next((t for t in pkg['targets'] if 'cdylib' in t['kind']), None)
          if cdylib is None: sys.exit(2)
          print(cdylib['name'])
          ")
          echo "cdylib target name: $target_name"
          if [ "$target_name" = "fluxora_stream" ]; then
            echo "  target name 'fluxora_stream' ✓"
            echo "  WASM basename 'fluxora_stream.wasm' ✓"
          else
            echo "::error::Target name changed: expected 'fluxora_stream', got '$target_name'"
            exit 1
          fi

      - name: Check package and artifact names (test suite)
        run: "cargo test --all-features packaging:: -- --nocapture --test-threads=1"

  # ── Coverage ───────────────────────────────────────────────────────────────
  # Informational gate; tarpaulin builds with --features testutils which can
  # hit dependency version skew in some environments.  continue-on-error is
  # intentional here only — all functional gates are in lint/test/build.
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (via rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Cache cargo-tarpaulin binary
        id: cache-tarpaulin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: ${{ runner.os }}-cargo-tarpaulin-0.31

      - name: Install cargo-tarpaulin
        if: steps.cache-tarpaulin.outputs.cache-hit != 'true'
        run: cargo install cargo-tarpaulin --version "^0.31" --locked

      - name: Generate coverage report
        run: |
          cargo tarpaulin \
            --features testutils \
            --out Xml \
            --out Html \
            --output-dir coverage \
            --ignore-tests \
            --skip-clean \
            --timeout 300 \
            -p fluxora-stream

      - name: Enforce 95% coverage gate
        id: coverage_gate
        run: |
          set -euo pipefail
          XML="coverage/cobertura.xml"
          if [ ! -f "$XML" ]; then
            echo "::error::Coverage report not found at $XML"
            exit 1
          fi
          LINE_RATE=$(grep -oP '(?<=<coverage )[^>]*' "$XML" | grep -oP 'line-rate="\K[0-9.]+')
          if [ -z "$LINE_RATE" ]; then
            echo "::error::Could not parse line-rate from $XML"
            exit 1
          fi
          PCT=$(awk "BEGIN { printf \"%d\", $LINE_RATE * 100 }")
          echo "Contract line coverage: ${PCT}% (threshold: 95%)"
          echo "coverage_pct=${PCT}" >> "$GITHUB_OUTPUT"
          if [ "$PCT" -lt 95 ]; then
            echo "::error::Coverage ${PCT}% is below the required 95% threshold."
            exit 1
          fi
          echo "::notice::Coverage gate passed: ${PCT}% >= 95%"

      - name: Post coverage summary
        if: always()
        run: |
          PCT="${{ steps.coverage_gate.outputs.coverage_pct }}"
          if [ -n "$PCT" ]; then
            {
              echo "## Coverage Report"
              echo ""
              echo "| Metric | Value |"
              echo "|--------|-------|"
              echo "| Line coverage | ${PCT}% |"
              echo "| Threshold | 95% |"
              if [ "$PCT" -ge 95 ]; then
                echo "| Status | ✅ Passed |"
              else
                echo "| Status | ❌ Failed |"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  # ── Nightly deep fuzz ─────────────────────────────────────────────────────
  # Runs on schedule only.  The randomised suites get a larger budget than a
  # per-PR run can afford; past runs found two real bugs.
  nightly-fuzz:
    name: Nightly deep fuzz
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (via rust-toolchain.toml)
        run: rustup show

      - name: Record toolchain version
        run: |
          {
            echo "## Rust toolchain (nightly-fuzz)"
            echo "| rustc | $(rustc --version) |"
            echo "| cargo | $(cargo --version) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: Swatinem/rust-cache@v2

      # Deep randomised sweep.  Both the property suite and the sequence suite
      # (which found the depleted-while-paused and top_up rounding bugs) are
      # included via --features testutils.  --release enables compiler
      # optimisations so the suite runs faster against the higher iteration
      # budgets below.
      - name: Deep fuzz — randomised property and sequence suites
        run: cargo test --release --workspace --features testutils
        env:
          FLUXORA_FUZZ_SEEDS: "200"
          FLUXORA_FUZZ_STEPS: "300"
          PROPTEST_CASES: "5000"

  # ── Deploy — testnet ───────────────────────────────────────────────────────
  deploy-testnet:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'testnet')
    environment: testnet
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: fluxora_stream-wasm
          path: ./artifacts

      - name: Install Stellar CLI (pinned)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          ARCHIVE="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          URL="https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/${ARCHIVE}"
          curl -sSfL "$URL" -o "$ARCHIVE"
          tar -xzf "$ARCHIVE"
          mv stellar "$HOME/.local/bin/stellar"
          chmod +x "$HOME/.local/bin/stellar"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          stellar --version

      - name: Configure testnet identity
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_TESTNET_SECRET_KEY }}
        run: |
          if [ -n "$STELLAR_SECRET_KEY" ]; then
            echo "$STELLAR_SECRET_KEY" | stellar keys add deployer --secret-key
          else
            echo "::warning::No STELLAR_TESTNET_SECRET_KEY secret configured. Skipping deployment."
            exit 0
          fi

      - name: Deploy to testnet
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_TESTNET_SECRET_KEY }}
        run: |
          if [ -z "$STELLAR_SECRET_KEY" ]; then
            echo "::warning::Skipping deployment — no secret key configured"
            exit 0
          fi
          WASM_FILE="./artifacts/fluxora_stream.wasm"
          echo "Deploying WASM: $WASM_FILE"
          stellar contract deploy \
            --wasm "$WASM_FILE" \
            --source deployer \
            --network testnet \
            || echo "::warning::Deployment failed or skipped"

  # ── Deploy — mainnet ───────────────────────────────────────────────────────
  deploy-mainnet:
    name: Deploy to Mainnet
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'mainnet'
    environment:
      name: mainnet
      url: https://stellar.expert
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: fluxora_stream-wasm
          path: ./artifacts

      - name: Verify WASM artifact exists
        run: |
          if [ -f ./artifacts/fluxora_stream.wasm ]; then
            echo "WASM artifact found ✓"
            sha256sum ./artifacts/fluxora_stream.wasm
          else
            echo "::error::No WASM artifact found — wasm build may have failed."
            exit 1
          fi

      - name: Install Stellar CLI (pinned)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          ARCHIVE="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          URL="https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/${ARCHIVE}"
          curl -sSfL "$URL" -o "$ARCHIVE"
          tar -xzf "$ARCHIVE"
          mv stellar "$HOME/.local/bin/stellar"
          chmod +x "$HOME/.local/bin/stellar"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          stellar --version

      - name: Configure mainnet identity
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_MAINNET_SECRET_KEY }}
        run: |
          if [ -n "$STELLAR_SECRET_KEY" ]; then
            echo "$STELLAR_SECRET_KEY" | stellar keys add deployer --secret-key
          else
            echo "::error::No STELLAR_MAINNET_SECRET_KEY secret configured."
            exit 1
          fi

      - name: Deploy to mainnet
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_MAINNET_SECRET_KEY }}
        run: |
          WASM_FILE="./artifacts/fluxora_stream.wasm"
          echo "Deploying WASM to mainnet: $WASM_FILE"
          stellar contract deploy \
            --wasm "$WASM_FILE" \
            --source deployer \
            --network mainnet

      - name: Output deployment info
        run: |
          echo "## Mainnet Deployment Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "Contract deployed to Stellar mainnet" >> "$GITHUB_STEP_SUMMARY"
