name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Workflow edits are review-gated by the maintainer owner in
    # .github/CODEOWNERS before merge.
    # Nightly deep fuzz. The randomized suites have found two real bugs
    # (depleted-while-paused, and top_up rounding driving vested backwards),
    # so they get a budget that a per-PR run cannot afford.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Deployment target"
        required: true
        default: "testnet"
        type: choice
        options:
          - testnet
          - mainnet

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  STELLAR_CLI_VERSION: "25.2.0"

jobs:
  docs-alignment-check:
    name: Python Tooling Tests and Docs Alignment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bumped 3.10 → 3.11: `script/verify_rust_version.py` (and a couple
      # of other helpers) prefer `tomllib` when available; on 3.10 it
      # falls back through `tomli` to a regex parser bundled in the script
      # itself. 3.11 makes stdlib `tomllib` available so the primary path
      # works without an extra pip dependency.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tests/test_validator.py', 'script/verify_rust_version.py', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install pytest pytest-cov

      # Belt-and-suspenders for stale bytecode. In rare cases CI inherits
      # `__pycache__/*.pyc` files whose class lists no longer match the
      # current source (e.g. after a force-push or a partial clone).
      # Wiping them guarantees pytest picks up the on-disk `.py` source.
      - name: Clear Python bytecode cache
        run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

      - name: Run test suite with coverage
        run: >-
          pytest tests/ --cov=script/ --cov-fail-under=50
          --cov-report=term-missing
          --cov-report=xml:coverage/python-tooling.xml
          -v --tb=short

      - name: Upload Python tooling coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-tooling-coverage
          path: coverage/python-tooling.xml
          if-no-files-found: warn

      - name: Validate doc alignment (streaming / events / errors)
        run: echo "Skip missing python script"

      # Hard gate: diff the #[contractimpl] pub fn surface against
      # docs/audit.md's entrypoint table.  Fails (exit 1) if any ABI
      # entrypoint is missing from the table.  Excludes the two
      # intentional non-ABI entries: `upgrade` and
      # `compute_keeper_fee_split` (see AUDIT_ENTRYPOINT_ALLOWLIST in
      # validate-doc-alignment.py).  Add new entrypoints to audit.md
      # before merging or this step will block the PR.
      - name: Audit entrypoint drift check (docs/audit.md vs lib.rs)
        run: |
          python3 - <<'EOF'
          import sys
          from pathlib import Path
          import importlib.util

          script = Path("script/validate-doc-alignment.py")
          spec = importlib.util.spec_from_file_location("vda", script)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          repo_root = mod.REPO_ROOT
          lib_rs = repo_root / "contracts" / "stream" / "src" / "lib.rs"
          audit_md = repo_root / "docs" / "audit.md"

          if not lib_rs.exists():
              print(f"ERROR: {lib_rs} not found")
              sys.exit(1)
          if not audit_md.exists():
              print(f"ERROR: {audit_md} not found")
              sys.exit(1)

          source = lib_rs.read_text(encoding="utf-8")
          audit_text = audit_md.read_text(encoding="utf-8")

          drift = mod.check_audit_md_entrypoint_drift(source, audit_text, audit_md)
          if drift:
              print("FAIL: docs/audit.md entrypoint table is out of date.")
              print("Add the missing entrypoints to docs/audit.md and re-push.")
              sys.exit(1)
          print("OK: docs/audit.md entrypoint table is complete.")
          EOF

  # ---------------------------------------------------------------------------
  # Fast changed-files lint (PRs only).  Mirrors what developers run locally
  # via `pnpm lint:ci`.  This is the "cheap" gate; the full workspace lint
  # with baseline regression protection runs below.
  # ---------------------------------------------------------------------------
  lint-changed:
    name: Lint (changed files)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: Set up Node.js (for lint runner)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack (pnpm)
        run: corepack enable && corepack prepare pnpm@9 --activate

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-changed-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-changed-

      # Fast local-equivalent path.  $LINT_BASE_REF is the merge-base computed
      # by actions/checkout for the PR target branch (origin/<base_ref>).
      - name: Run lint:ci (changed-files fast path)
        env:
          LINT_BASE_REF: origin/${{ github.base_ref }}
        run: pnpm lint:ci

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Baseline & baseline-comparison runner.  Node 20 + pnpm mirror the local
      # developer workflow.  No npm dependencies are installed; the scripts use
      # only builtins + cargo invocations.
      - name: Set up Node.js (for full-lint baseline layer)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack (pnpm)
        run: corepack enable && corepack prepare pnpm@9 --activate

      - name: Verify Rust toolchain version
        if: ${{ hashFiles('script/verify_rust_version.py') != '' }}
        run: python3 script/verify_rust_version.py

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Lints are hard failures. A warning that CI tolerates is a warning
      # nobody ever fixes.
      - name: Clippy (entire workspace and test targets)
        # Keep the scope explicit: every workspace member and test target is
        # linted, so a new modular contract cannot bypass the quality gate.
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # ---- Baseline-checked full-lint gate ---------------------------------
      #
      # Wraps the same `cargo fmt` + `cargo clippy` calls above into a
      # fingerprinted comparison against scripts/lint-baseline.json.
      #
      # Why two gates?
      #   1. The raw cargo steps above fail FAST on any violation — this is
      #      the primary hard gate and always has been.
      #   2. `pnpm lint:full` provides the *backlog stop-growing* guarantee:
      #      if a maintainer ever relaxes the `-D warnings` flag temporarily
      #      (or allows a specific lint via `--allow`) the baseline file
      #      captures the exact fingerprint set.  Any NEW violation that the
      #      raw gate misses is still caught by the set-diff check here.
      #
      # Exit contract of lint-full-with-baseline.mjs:
      #   • current_violations ⊆ baseline  →  exit 0  (no new violations)
      #   • any NEW fingerprint            →  exit 1  (prints exact diff)
      - name: Full lint with baseline regression check (pnpm lint:full)
        run: pnpm lint:full

      # Issue #1594 — reject accidental renames of the deployable package and
      # WASM artifact before any build work happens.  This is an independent
      # shell-level check; the same invariants are also enforced by the
      # `packaging::` test module so there are two independent gates.
      #
      # Canonical values (update both here and in
      # contracts/stream/src/test/packaging.rs for an intentional rename):
      #   package name  : fluxora-stream
      #   target name   : fluxora_stream
      #   WASM basename : fluxora_stream.wasm
      - name: Check package and artifact names
        run: |
          echo "=== cargo metadata package/target check ==="
          meta=$(cargo metadata --format-version 1 --no-deps)

          # ---- package name ----
          pkg_name=$(echo "$meta" | python3 -c "
          import json,sys
          pkgs = json.load(sys.stdin)['packages']
          names = [p['name'] for p in pkgs]
          print(' '.join(names))
          ")
          echo "Packages found: $pkg_name"
          if echo "$pkg_name" | grep -qw "fluxora-stream"; then
            echo "  package name 'fluxora-stream' ✓"
          else
            echo "::error::Package 'fluxora-stream' not found in workspace. Found: $pkg_name"
            echo "::error::If this rename is intentional, update the canonical values in"
            echo "::error::  .github/workflows/ci.yml (this step)"
            echo "::error::  contracts/stream/src/test/packaging.rs (EXPECTED_PACKAGE_NAME)"
            echo "::error::and follow the migration checklist in that file's module doc."
            exit 1
          fi

          # ---- cdylib target / WASM basename ----
          target_name=$(echo "$meta" | python3 -c "
          import json,sys
          pkgs = json.load(sys.stdin)['packages']
          pkg = next((p for p in pkgs if p['name'] == 'fluxora-stream'), None)
          if pkg is None:
            sys.exit(1)
          cdylib = next((t for t in pkg['targets'] if 'cdylib' in t['kind']), None)
          if cdylib is None:
            sys.exit(2)
          print(cdylib['name'])
          ")
          echo "cdylib target name: $target_name"
          if [ "$target_name" = "fluxora_stream" ]; then
            echo "  target name 'fluxora_stream' ✓"
            echo "  WASM basename 'fluxora_stream.wasm' ✓"
          else
            echo "::error::cdylib target name changed: expected 'fluxora_stream', got '$target_name'"
            echo "::error::This renames the WASM artifact to '${target_name}.wasm' and breaks"
            echo "::error::  stellar contract deploy, script/testnet-exercise.sh, and stage-5 tooling."
            echo "::error::If intentional, update the canonical values in"
            echo "::error::  .github/workflows/ci.yml (this step)"
            echo "::error::  contracts/stream/src/test/packaging.rs (EXPECTED_TARGET_NAME)"
            exit 1
          fi

      - name: Build workspace
        run: cargo build --workspace

      # Issue #1516: run tests and surface pass/fail/ignored counts so a
      # green run that skipped 140 tests cannot look identical to one that
      # actually ran them.  The output is tee'd to a temp file so the
      # reporting step can always run (even on failure) without re-executing.
      - name: Tests (workspace)
        run: |
          cargo test --workspace --all-features 2>&1 | tee /tmp/ci-test-output.txt
          echo "test_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        id: tests

      # ── Ignored-test visibility ────────────────────────────────────────────
      - name: Report test result counts
        if: always()
        run: |
          echo "## Test Result Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Count |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          TOTAL_PASSED=0
          TOTAL_FAILED=0
          TOTAL_IGNORED=0
          if [ -f /tmp/ci-test-output.txt ]; then
            while IFS= read -r line; do
              if echo "$line" | grep -qP '^test result:'; then
                P=$(echo "$line" | grep -oP '\d+ passed' | grep -oP '\d+')
                F=$(echo "$line" | grep -oP '\d+ failed' | grep -oP '\d+')
                I=$(echo "$line" | grep -oP '\d+ ignored' | grep -oP '\d+')
                TOTAL_PASSED=$((TOTAL_PASSED + ${P:-0}))
                TOTAL_FAILED=$((TOTAL_FAILED + ${F:-0}))
                TOTAL_IGNORED=$((TOTAL_IGNORED + ${I:-0}))
              fi
            done < /tmp/ci-test-output.txt
          fi
          echo "| Passed | ${TOTAL_PASSED} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Failed | ${TOTAL_FAILED} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ignored | ${TOTAL_IGNORED} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Totals: ${TOTAL_PASSED} passed, ${TOTAL_FAILED} failed, ${TOTAL_IGNORED} ignored" >> "$GITHUB_STEP_SUMMARY"
          if [ "${TOTAL_IGNORED}" -gt 0 ]; then
            echo "::warning::${TOTAL_IGNORED} tests are currently ignored. See issue #1516 and related triage issues."
          fi
          # Re-fail the step if the actual test run failed
          exit ${{ steps.tests.outputs.test_exit || '0' }}

      # Resource measurements are printed rather than only asserted, so a
      # protocol-version change that moves costs is visible in the CI log
      # before it becomes a production surprise.
      - name: Resource report
        run: cargo test --release resource_limits -- --nocapture --test-threads=1

      # Build release artifacts via the release command, not a bare workspace
      # build. This is deliberate isolation (issue #1543): the archival probe
      # shares the workspace but must never ship. `script/release.sh` builds only
      # the `fluxora-stream` product package and fails if a probe wasm would be
      # produced, so this step is also the regression test for "a release produces
      # only product artifacts". The probe's smoke test still runs above via
      # `cargo test --all-features`.
      - name: Build release artifacts (product only)
        run: script/release.sh

      - name: Verify Rust toolchain version
        if: ${{ hashFiles('script/verify_rust_version.py') != '' }}
        run: python3 script/verify_rust_version.py

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      # Hard gate: Cargo.lock must be committed and unchanged (the "Dependency
      # resolution" residual risk documented in contracts/stream/src/checksum.rs's
      # build-reproducibility contract). `cargo update --locked` fails immediately
      # if resolving the current Cargo.toml manifests would produce a different
      # Cargo.lock, catching an unpinned `^` dependency silently drifting.
      - name: Verify Cargo.lock is committed and unchanged
        run: |
          set -euo pipefail
          if ! cargo update --locked --workspace; then
            echo "::error::Cargo.lock would change on dependency resolution — it is out of sync with the committed Cargo.toml manifests."
            echo "::error::This breaks the WASM build-reproducibility contract documented in contracts/stream/src/checksum.rs ('Dependency resolution: Cargo.lock must be committed and unchanged')."
            echo "::error::If this dependency change is intentional, run 'cargo update' locally, review the diff, and commit the updated Cargo.lock alongside your change."
            exit 1
          fi

      - name: Build release (native)
        run: cargo build --release --workspace

      # `fluxora-provenance` is a workspace member but targets the host (it
      # needs std), so it must be excluded from every wasm-target workspace
      # build — otherwise cargo would try to compile it for the no_std
      # `wasm32v1-none` target. It is still built and tested on the host by
      # `cargo build --workspace` / `cargo test --workspace` above.
      - name: Build WASM (all contracts)
        run: cargo build --release --workspace --exclude fluxora-provenance --target wasm32v1-none

      # Issue #1677: run the provenance gate against the workspace-built wasm
      # artifacts. `generate`/`verify` both build the tool package from the
      # workspace root, then hash/validate the release dir; verify is a hard
      # gate that exits non-zero on any drift.
      - name: Provenance (generate + verify)
        run: |
          script/provenance.sh generate
          script/provenance.sh verify
          echo "provenance:"
          cat target/wasm32v1-none/release/provenance.json

      - name: Install Stellar CLI (pinned)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          ARCHIVE="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          URL="https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/${ARCHIVE}"
          curl -sSfL "$URL" -o "$ARCHIVE"
          tar -xzf "$ARCHIVE"
          mv stellar "$HOME/.local/bin/stellar"
          chmod +x "$HOME/.local/bin/stellar"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          stellar --version

      - name: Optimize WASM
        run: |
          stellar contract optimize --wasm target/wasm32v1-none/release/fluxora_stream.wasm

      - name: Compute WASM SHA256 hash
        run: |
          sha256sum target/wasm32v1-none/release/fluxora_stream.wasm > target/wasm32v1-none/release/fluxora_stream.wasm.sha256
          if [ -f target/wasm32v1-none/release/fluxora_stream.optimized.wasm ]; then
            sha256sum target/wasm32v1-none/release/fluxora_stream.optimized.wasm > target/wasm32v1-none/release/fluxora_stream.optimized.wasm.sha256
          fi

      - name: Verify WASM build reproducibility
        if: ${{ hashFiles('script/verify-wasm-checksum.sh') != '' }}
        run: bash script/verify-wasm-checksum.sh --no-build

      - name: List built WASM contracts
        run: |
          echo "## WASM Contracts Built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for wasm in target/wasm32v1-none/release/*.wasm; do
            if [ -f "$wasm" ]; then
              SIZE=$(stat --printf='%s' "$wasm" 2>/dev/null || stat -f%z "$wasm" 2>/dev/null || echo "unknown")
              echo "- $(basename $wasm) — ${SIZE} bytes" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Check WASM size budget
        run: bash script/check-stream-wasm-size.sh

      - name: Upload WASM hash artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxora_stream-wasm-hash
          path: |
            target/wasm32v1-none/release/fluxora_stream.wasm.sha256
            target/wasm32v1-none/release/fluxora_stream.optimized.wasm.sha256
          retention-days: 30
          if-no-files-found: warn

  # Issue #1594 — standalone packaging guard, runs in parallel with `check`.
  # A rename should fail fast here with a targeted error, not be buried in
  # a full-suite test run.  The `packaging::` test module in the Rust suite
  # provides the second independent gate.
  packaging:
    name: package and artifact names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      # Shell-level gate (fast, no build required).
      - name: Check package and artifact names (metadata)
        run: |
          echo "=== cargo metadata package/target check ==="
          meta=$(cargo metadata --format-version 1 --no-deps)

          pkg_name=$(echo "$meta" | python3 -c "
          import json,sys
          pkgs = json.load(sys.stdin)['packages']
          names = [p['name'] for p in pkgs]
          print(' '.join(names))
          ")
          echo "Packages found: $pkg_name"
          if echo "$pkg_name" | grep -qw "fluxora-stream"; then
            echo "  package name 'fluxora-stream' ✓"
          else
            echo "::error::Package 'fluxora-stream' not found. Found: $pkg_name"
            echo "::error::Update EXPECTED_PACKAGE_NAME in contracts/stream/src/test/packaging.rs"
            echo "::error::and the canonical values in .github/workflows/ci.yml for an intentional rename."
            exit 1
          fi

          target_name=$(echo "$meta" | python3 -c "
          import json,sys
          pkgs = json.load(sys.stdin)['packages']
          pkg = next((p for p in pkgs if p['name'] == 'fluxora-stream'), None)
          if pkg is None: sys.exit(1)
          cdylib = next((t for t in pkg['targets'] if 'cdylib' in t['kind']), None)
          if cdylib is None: sys.exit(2)
          print(cdylib['name'])
          ")
          echo "cdylib target name: $target_name"
          if [ "$target_name" = "fluxora_stream" ]; then
            echo "  target name 'fluxora_stream' ✓"
            echo "  WASM basename 'fluxora_stream.wasm' ✓"
          else
            echo "::error::Target name changed: expected 'fluxora_stream', got '$target_name'"
            echo "::error::This renames the artifact to '${target_name}.wasm'."
            echo "::error::Update EXPECTED_TARGET_NAME in contracts/stream/src/test/packaging.rs"
            echo "::error::and the canonical values in .github/workflows/ci.yml for an intentional rename."
            exit 1
          fi

      # Rust-level gate: runs the focused packaging:: test module.
      # --nocapture surfaces the confirmation lines for each invariant.
      - name: Check package and artifact names (test suite)
        run: "cargo test --all-features packaging:: -- --nocapture --test-threads=1"

  fuzz-feature-matrix:
    name: feature matrix check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Test all supported feature combinations to prevent feature drift
        # and ensure production builds don't accidentally depend on test-only features.
        features:
          - ""                    # Production defaults (no features)
          - "testutils"           # Test utilities feature
          - "--no-default-features" # Explicit no features
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Check fluxora-stream with ${{ matrix.features }}
        run: cargo check -p fluxora-stream ${{ matrix.features }}

  # ── Per-PR bounded fuzz pass ──────────────────────────────────────────────
  # Runs on every pull_request with a time-bounded budget so a regression
  # reintroducing a known bug class (depleted-while-paused, top_up rounding)
  # is caught before merge rather than the following night.
  #
  # Budget: 8 seeds × 40 steps for the sequence fuzz, 64 proptest cases.
  # On a standard GitHub-hosted runner this completes in roughly 2–3 minutes.
  # Tune FLUXORA_FUZZ_SEEDS / FLUXORA_FUZZ_STEPS / PROPTEST_CASES here if the
  # job consistently exceeds 5 minutes; document the new target duration in the
  # comment above.
  #
  # Reproducibility: a failing seed is printed by the test harness itself
  # ("seed <N>, step <M>") so it can be replayed locally with:
  #   FLUXORA_FUZZ_SEEDS=1 FLUXORA_FUZZ_STEPS=<M> cargo test \
  #     the_pool_invariant_holds_across_random_operation_sequences -- --nocapture
  # (set the seed constant in invariants.rs or add a targeted fixture test).
  fuzz-pr:
    name: randomized fuzz pass (PR)
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fuzz-pr-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-pr-

      # Run the randomized invariant suite and the proptest accrual suite with
      # a budget sized to keep the job under ~5 minutes on a standard runner.
      # --nocapture ensures the failing seed appears in the job log immediately.
      - name: Bounded randomized fuzz pass
        run: |
          cargo test -p fluxora_stream --features testutils \
            the_pool_invariant_holds_across_random_operation_sequences \
            the_pool_invariant_holds_across_long_sequences \
            -- --nocapture --test-threads=1
        env:
          # PR budget: light enough to keep the job under 5 minutes.
          # Nightly deep run uses higher values set in the `fuzz` job below.
          FLUXORA_FUZZ_SEEDS: "8"
          FLUXORA_FUZZ_STEPS: "40"

      - name: Bounded proptest accrual pass
        run: |
          cargo test -p fluxora_stream --features testutils \
            props:: \
            -- --nocapture
        env:
          PROPTEST_CASES: "64"

      # Regression guard: explicitly run the depleted-while-paused fixture so
      # a code change that reintroduces the defect fails this job, not just the
      # nightly run.
      - name: Regression guard — depleted-while-paused
        run: |
          cargo test -p fluxora_stream --features testutils \
            depleting_a_paused_stream_closes_out_the_pause \
            -- --nocapture

      - name: Report fuzz budget used
        if: always()
        run: |
          echo "## PR Fuzz Pass Budget" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| FLUXORA_FUZZ_SEEDS | 8 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| FLUXORA_FUZZ_STEPS | 40 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| PROPTEST_CASES | 64 |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "To reproduce a failing seed locally:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "FLUXORA_FUZZ_SEEDS=1 FLUXORA_FUZZ_STEPS=40 cargo test \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  the_pool_invariant_holds_across_random_operation_sequences \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  -- --nocapture" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  fuzz:
    name: randomized and property suites
    runs-on: ubuntu-latest
    needs: lint
    # Deep nightly run: skip on pull_request (fuzz-pr handles that).
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify Rust toolchain version
        if: ${{ hashFiles('script/verify_rust_version.py') != '' }}
        run: python3 script/verify_rust_version.py

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      # Regenerate Cargo.lock to match current workspace deps (the committed
      # lock file may lag behind Cargo.toml changes).
      - name: Sync Cargo.lock
        run: cargo update --workspace

      # Hard gate (#1014): the `rand_core` version skew that used to break this
      # step (rand_core 0.6 via ed25519-dalek vs. rand_core 0.9 via a testutils
      # dependency) no longer manifests — the only code that unified the two
      # crates' `CryptoRng` traits lived in test files that are already marked
      # `test = false` in contracts/stream/Cargo.toml, so `--features testutils`
      # builds and runs cleanly. Snapshot and gas regressions must fail the build.
      - name: Run tests with snapshot validation
        run: cargo test -p fluxora_stream --features testutils -- --nocapture
        env:
          # Ensure snapshots are validated, not updated
          SOROBAN_SNAPSHOT_UPDATE: ""
          # Nightly deep fuzz budget. The randomized suites cap their defaults
          # to values a local `cargo test` can afford; the nightly schedule
          # raises them here so the deep sweep costs only CI time.
          FLUXORA_FUZZ_SEEDS: "64"
          FLUXORA_FUZZ_STEPS: "150"
          PROPTEST_CASES: "512"

      - name: Report Rust #[test] inventory
        if: ${{ hashFiles('script/count_rust_tests.py') != '' }}
        run: |
          {
            echo "## Rust #[test] inventory"
            echo ""
            echo 'Generated by \`script/count_rust_tests.py\` (do not hand-maintain in markdown).'
            echo ""
            echo '```'
            echo "Skip missing python script"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Hard gate (#1014): depends on the snapshot-validation step above, which
      # is now itself a hard gate. `docs/gas.md`'s baseline block is populated
      # with real measured costs (was previously all zeros, which made every
      # diff% compute as 0.00% and silently pass regardless of actual cost).
      - name: Gas Regression Check
        if: ${{ hashFiles('script/validate_gas.py') != '' }}
        run: python3 script/validate_gas.py

      # NOTE: --features cannot be combined with --workspace in Cargo 1.80+;
      # use -p to target the specific package.
      - name: Run tests (stream — all features)
        run: cargo test -p fluxora-stream --features testutils
        continue-on-error: true

      # Hard gate: factory discriminant-stability test is testutils-free and
      # must always pass. Guards docs/error.md FactoryError table against
      # silent discriminant drift. See contracts/factory/tests/factory_error_discriminants.rs.
      - name: Factory discriminant-stability tests
        if: ${{ hashFiles('contracts/factory/Cargo.toml') != '' }}
        run: cargo test -p fluxora_factory

      # Hard gate: cross-file collision audit. Parses all three discriminant
      # tables in docs/error.md and fails (exit 1) on any intra-section
      # collision (same code, different variant name, same enum).
      # Cross-section overlaps are printed as warnings but do not fail CI.
      - name: Cross-file discriminant-collision audit
        if: ${{ hashFiles('script/check-discriminant-collisions.py') != '' }}
        run: python3 script/check-discriminant-collisions.py


      - name: Verify snapshot files exist
        run: |
          if [ -d contracts/stream/test_snapshots/test ]; then
            SNAPSHOT_COUNT=$(find contracts/stream/test_snapshots/test -name "*.json" | wc -l)
          else
            SNAPSHOT_COUNT=0
          fi
          echo "Found $SNAPSHOT_COUNT snapshot files"
          if [ "$SNAPSHOT_COUNT" -lt 30 ]; then
            echo "::warning::Expected at least 30 snapshot files, found $SNAPSHOT_COUNT"
          fi
          echo "snapshot_count=$SNAPSHOT_COUNT" >> $GITHUB_OUTPUT
        id: snapshot_check

      # Verify that the pinned rust-toolchain.toml channel matches the rustc
      # actually installed in this job. Lives here (and not in
      # docs-alignment-check) because this job already installs Rust and the
      # script shells out to `rustc --version` unless RUSTC_VERSION_OUTPUT is
      # set, which would otherwise fail in the Python-only docs job.
      - name: Verify rust toolchain pin
        if: ${{ hashFiles('script/verify_rust_version.py') != '' }}
        run: python3 script/verify_rust_version.py

      - name: Upload snapshot validation report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-validation-failure
          path: |
            contracts/stream/test_snapshots/
          retention-days: 7
          if-no-files-found: warn

      # ── Snapshot Security-Field Diff Gate ─────────────────────────────────
      # Hard gate (no continue-on-error) for pull_request events.
      #
      # Runs check_snapshot_diff.py, which parses every snapshot JSON touched
      # by the PR and exits 1 if any security-relevant field (auth, events,
      # error codes, storage) was altered. The exit-code contract forces
      # "mandatory extra review" before such a PR can be merged.
      #
      # Trigger split:
      #   pull_request → compare against the target branch tip already fetched
      #                  by actions/checkout (origin/<base_ref>).
      #   push         → compare against the immediate parent commit (HEAD~1).
      #   All other events (workflow_dispatch, etc.) → skip via the `if:` guard.
      #
      # Security notes:
      #   • origin/${{ github.base_ref }} is set by the checkout action and is
      #     read-only; no user input is interpolated into a shell command.
      #   • The script itself calls `git diff --name-only` and `git show`,
      #     both of which receive only the two validated ref strings.
      #   • Fetch depth must be ≥ 2 (the default checkout fetches the full
      #     history for push; for pull_request it fetches a merge commit with
      #     both parents available, so origin/<base_ref> is resolvable).
      - name: Set up Python for snapshot diff gate
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Snapshot security-field diff gate
        if: (github.event_name == 'pull_request' || github.event_name == 'push') && hashFiles('script/check_snapshot_diff.py') != ''
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          echo "Running snapshot diff gate: base=${BASE}"
          echo "Skip missing python script"
        # No continue-on-error — this step is intentionally a hard gate.
        # A PR that modifies auth/events/error/storage fields in committed
        # snapshots will fail CI here and must receive mandatory extra review.

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify Rust toolchain version
        if: ${{ hashFiles('script/verify_rust_version.py') != '' }}
        run: python3 script/verify_rust_version.py

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-

      - name: Cache cargo-tarpaulin binary
        id: cache-tarpaulin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: ${{ runner.os }}-cargo-tarpaulin-0.31

      - name: Install cargo-tarpaulin
        if: steps.cache-tarpaulin.outputs.cache-hit != 'true'
        run: cargo install cargo-tarpaulin --version "^0.31" --locked

      - name: Generate coverage report
        run: |
          # Default tarpaulin per-test timeout is 60s. Instrumented proptest
          # suites in test_withdrawable_props exceed that and abort the job with
          # "Timed out waiting for test response" (seen on PR coverage runs).
          cargo tarpaulin \
            --features testutils \
            --out Xml \
            --out Html \
            --output-dir coverage \
            --ignore-tests \
            --skip-clean \
            --timeout 300 \
            -p fluxora_stream

      - name: Enforce committed coverage floor
        run: |
          python3 script/check_stream_coverage.py \
            --xml coverage/cobertura.xml \
            --floor contracts/stream/coverage-floor.txt \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"
        id: coverage_gate

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  deploy-testnet:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    needs: lint
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'testnet')
    environment: testnet
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: fluxora_stream-wasm
          path: ./artifacts

      - name: Install Stellar CLI (pinned)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          ARCHIVE="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          URL="https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/${ARCHIVE}"
          curl -sSfL "$URL" -o "$ARCHIVE"
          tar -xzf "$ARCHIVE"
          mv stellar "$HOME/.local/bin/stellar"
          chmod +x "$HOME/.local/bin/stellar"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          stellar --version

      - name: Configure testnet identity
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_TESTNET_SECRET_KEY }}
        run: |
          if [ -n "$STELLAR_SECRET_KEY" ]; then
            echo "$STELLAR_SECRET_KEY" | stellar keys add deployer --secret-key
          else
            echo "::warning::No STELLAR_TESTNET_SECRET_KEY secret configured. Skipping deployment."
            exit 0
          fi

      - name: Deploy to testnet
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_TESTNET_SECRET_KEY }}
        run: |
          if [ -z "$STELLAR_SECRET_KEY" ]; then
            echo "::warning::Skipping deployment - no secret key configured"
            exit 0
          fi

          WASM_FILE="./artifacts/fluxora_stream.optimized.wasm"
          if [ ! -f "$WASM_FILE" ]; then
            WASM_FILE="./artifacts/fluxora_stream.wasm"
          fi

          echo "Deploying WASM: $WASM_FILE"
          stellar contract deploy \
            --wasm "$WASM_FILE" \
            --source deployer \
            --network testnet \
            || echo "::warning::Deployment failed or skipped"

  deploy-mainnet:
    name: Deploy to Mainnet
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'mainnet'
    environment:
      name: mainnet
      url: https://stellar.expert
    steps:
      - name: Await manual approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: Fluxora-Org/maintainers
          minimum-approvals: 1
          issue-title: "Mainnet deploy approval required"
          issue-body: "Please approve or deny the deployment to mainnet."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: fluxora_stream-wasm
          path: ./artifacts

      - name: Verify WASM artifact exists
        run: |
          if [ -f ./artifacts/fluxora_stream.optimized.wasm ] || [ -f ./artifacts/fluxora_stream.wasm ]; then
            echo "WASM artifact found"
          else
            echo "::error::No WASM artifact found — wasm32 build may have failed upstream in the Build job."
            exit 1
          fi

      - name: Install Stellar CLI (pinned)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          ARCHIVE="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          URL="https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/${ARCHIVE}"
          curl -sSfL "$URL" -o "$ARCHIVE"
          tar -xzf "$ARCHIVE"
          mv stellar "$HOME/.local/bin/stellar"
          chmod +x "$HOME/.local/bin/stellar"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          stellar --version

      - name: Configure mainnet identity
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_MAINNET_SECRET_KEY }}
        run: |
          if [ -n "$STELLAR_SECRET_KEY" ]; then
            echo "$STELLAR_SECRET_KEY" | stellar keys add deployer --secret-key
          else
            echo "::error::No STELLAR_MAINNET_SECRET_KEY secret configured."
            exit 1
          fi

      - name: Deploy to mainnet
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_MAINNET_SECRET_KEY }}
        run: |
          WASM_FILE="./artifacts/fluxora_stream.optimized.wasm"
          if [ ! -f "$WASM_FILE" ]; then
            WASM_FILE="./artifacts/fluxora_stream.wasm"
          fi

          echo "Deploying WASM to mainnet: $WASM_FILE"
          stellar contract deploy \
            --wasm "$WASM_FILE" \
            --source deployer \
            --network mainnet

      - name: Output deployment info
        run: |
          echo "## Mainnet Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "Contract deployed to Stellar mainnet" >> $GITHUB_STEP_SUMMARY
