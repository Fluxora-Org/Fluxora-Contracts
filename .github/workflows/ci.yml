name: CI

on:
  push:
    branches: [main, v1-rewrite]
  pull_request:
  schedule:
    # Nightly deep fuzz. The randomized suites have found two real bugs
    # (depleted-while-paused, and top_up rounding driving vested backwards),
    # so they get a budget that a per-PR run cannot afford.
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test, wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain, including the wasm32v1-none target, comes from
      # rust-toolchain.toml so local and CI builds cannot drift.
      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      # Lints are hard failures. A warning that CI tolerates is a warning
      # nobody ever fixes.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Issue #1594 — reject accidental renames of the deployable package and
      # WASM artifact before any build work happens.  This is an independent
      # shell-level check; the same invariants are also enforced by the
      # `packaging::` test module so there are two independent gates.
      #
      # Canonical values (update both here and in
      # contracts/stream/src/test/packaging.rs for an intentional rename):
      #   package name  : fluxora-stream
      #   target name   : fluxora_stream
      #   WASM basename : fluxora_stream.wasm
      - name: Check package and artifact names
        run: |
          echo "=== cargo metadata package/target check ==="
          meta=$(cargo metadata --format-version 1 --no-deps)

          # ---- package name ----
          pkg_name=$(echo "$meta" | python3 -c "
          import json,sys
          pkgs = json.load(sys.stdin)['packages']
          names = [p['name'] for p in pkgs]
          print(' '.join(names))
          ")
          echo "Packages found: $pkg_name"
          if echo "$pkg_name" | grep -qw "fluxora-stream"; then
            echo "  package name 'fluxora-stream' ✓"
          else
            echo "::error::Package 'fluxora-stream' not found in workspace. Found: $pkg_name"
            echo "::error::If this rename is intentional, update the canonical values in"
            echo "::error::  .github/workflows/ci.yml (this step)"
            echo "::error::  contracts/stream/src/test/packaging.rs (EXPECTED_PACKAGE_NAME)"
            echo "::error::and follow the migration checklist in that file's module doc."
            exit 1
          fi

          # ---- cdylib target / WASM basename ----
          target_name=$(echo "$meta" | python3 -c "
          import json,sys
          pkgs = json.load(sys.stdin)['packages']
          pkg = next((p for p in pkgs if p['name'] == 'fluxora-stream'), None)
          if pkg is None:
            sys.exit(1)
          cdylib = next((t for t in pkg['targets'] if 'cdylib' in t['kind']), None)
          if cdylib is None:
            sys.exit(2)
          print(cdylib['name'])
          ")
          echo "cdylib target name: $target_name"
          if [ "$target_name" = "fluxora_stream" ]; then
            echo "  target name 'fluxora_stream' ✓"
            echo "  WASM basename 'fluxora_stream.wasm' ✓"
          else
            echo "::error::cdylib target name changed: expected 'fluxora_stream', got '$target_name'"
            echo "::error::This renames the WASM artifact to '${target_name}.wasm' and breaks"
            echo "::error::  stellar contract deploy, script/testnet-exercise.sh, and stage-5 tooling."
            echo "::error::If intentional, update the canonical values in"
            echo "::error::  .github/workflows/ci.yml (this step)"
            echo "::error::  contracts/stream/src/test/packaging.rs (EXPECTED_TARGET_NAME)"
            exit 1
          fi

      - name: Tests
        run: cargo test --all-features

      # Resource measurements are printed rather than only asserted, so a
      # protocol-version change that moves costs is visible in the CI log
      # before it becomes a production surprise.
      - name: Resource report
        run: cargo test resource_limits -- --nocapture --test-threads=1

      - name: Build contract WASM
        run: cargo build --target wasm32v1-none --release

      - name: Report WASM size
        run: |
          size=$(stat -c%s target/wasm32v1-none/release/fluxora_stream.wasm)
          echo "fluxora_stream.wasm: ${size} bytes"
          # Soroban caps a contract code entry at 131072 bytes.
          if [ "$size" -gt 131072 ]; then
            echo "::error::WASM exceeds the 128 KiB contract code entry limit"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: fluxora-stream-wasm
          path: target/wasm32v1-none/release/fluxora_stream.wasm

  # Issue #1594 — standalone packaging guard, runs in parallel with `check`.
  # A rename should fail fast here with a targeted error, not be buried in
  # a full-suite test run.  The `packaging::` test module in the Rust suite
  # provides the second independent gate.
  packaging:
    name: package and artifact names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      # Shell-level gate (fast, no build required).
      - name: Check package and artifact names (metadata)
        run: |
          echo "=== cargo metadata package/target check ==="
          meta=$(cargo metadata --format-version 1 --no-deps)

          pkg_name=$(echo "$meta" | python3 -c "
          import json,sys
          pkgs = json.load(sys.stdin)['packages']
          names = [p['name'] for p in pkgs]
          print(' '.join(names))
          ")
          echo "Packages found: $pkg_name"
          if echo "$pkg_name" | grep -qw "fluxora-stream"; then
            echo "  package name 'fluxora-stream' ✓"
          else
            echo "::error::Package 'fluxora-stream' not found. Found: $pkg_name"
            echo "::error::Update EXPECTED_PACKAGE_NAME in contracts/stream/src/test/packaging.rs"
            echo "::error::and the canonical values in .github/workflows/ci.yml for an intentional rename."
            exit 1
          fi

          target_name=$(echo "$meta" | python3 -c "
          import json,sys
          pkgs = json.load(sys.stdin)['packages']
          pkg = next((p for p in pkgs if p['name'] == 'fluxora-stream'), None)
          if pkg is None: sys.exit(1)
          cdylib = next((t for t in pkg['targets'] if 'cdylib' in t['kind']), None)
          if cdylib is None: sys.exit(2)
          print(cdylib['name'])
          ")
          echo "cdylib target name: $target_name"
          if [ "$target_name" = "fluxora_stream" ]; then
            echo "  target name 'fluxora_stream' ✓"
            echo "  WASM basename 'fluxora_stream.wasm' ✓"
          else
            echo "::error::Target name changed: expected 'fluxora_stream', got '$target_name'"
            echo "::error::This renames the artifact to '${target_name}.wasm'."
            echo "::error::Update EXPECTED_TARGET_NAME in contracts/stream/src/test/packaging.rs"
            echo "::error::and the canonical values in .github/workflows/ci.yml for an intentional rename."
            exit 1
          fi

      # Rust-level gate: runs the focused packaging:: test module.
      # --nocapture surfaces the confirmation lines for each invariant.
      - name: Check package and artifact names (test suite)
        run: "cargo test --all-features packaging:: -- --nocapture --test-threads=1"

  fuzz:
    name: randomized and property suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      # On a PR this is a moderate sweep — deeper than the default `cargo test`
      # but still fast. On the nightly schedule it goes much wider. Both run in
      # release mode; the randomized suite is dominated by host invocations and
      # is several times faster optimized.
      # Budget note: the randomized suite costs roughly seeds x steps^2, not
      # seeds x steps — the invariant scan reads every stream after every
      # operation, and the stream count itself grows with steps. Measured
      # 2026-08-12: 120 seeds x 250 steps = 238s, which puts 400x400 at ~34
      # minutes. Raise *seeds* to buy coverage; raise steps only deliberately.
      #   400 x 200 ~= 8.5 min (nightly)
      #    60 x 200 ~= 1.3 min (per PR)
      - name: Set fuzz budget
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "FLUXORA_FUZZ_SEEDS=400" >> "$GITHUB_ENV"
            echo "FLUXORA_FUZZ_STEPS=200" >> "$GITHUB_ENV"
            echo "PROPTEST_CASES=20000"   >> "$GITHUB_ENV"
          else
            echo "FLUXORA_FUZZ_SEEDS=60"  >> "$GITHUB_ENV"
            echo "FLUXORA_FUZZ_STEPS=200" >> "$GITHUB_ENV"
            echo "PROPTEST_CASES=2000"    >> "$GITHUB_ENV"
          fi

      - name: Pool invariant under randomized operation sequences
        run: "cargo test --release --all-features invariants:: -- --nocapture"

      - name: Accrual property suite
        run: "cargo test --release --all-features props:: -- --nocapture"

      # A failing proptest writes the shrunk input to
      # contracts/stream/proptest-regressions/. Those files are committed so a
      # found failure stays found — surface them if CI produced any that are
      # not already tracked.
      - name: Surface new proptest regression seeds
        if: failure()
        run: |
          echo "::group::proptest regression files"
          find . -name "*.txt" -path "*proptest-regressions*" -exec sh -c \
            'echo "--- $1"; cat "$1"' _ {} \;
          echo "::endgroup::"
          git status --porcelain -- '*proptest-regressions*' || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failure-seeds
          path: |
            **/proptest-regressions/**
            **/test_snapshots/**
          if-no-files-found: ignore
