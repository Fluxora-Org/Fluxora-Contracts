[workspace]
resolver = "2"
members = ["contracts/archival-probe", "contracts/stream"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Fluxora-Org/Fluxora-Contracts"

[workspace.dependencies]
# Protocol 27 is live on both testnet and mainnet as of 2026-08.
# soroban-sdk's major version tracks the Stellar protocol version; do not
# upgrade past the protocol the target network actually runs.
soroban-sdk = "27.0.5"
# Used by the packaging tests to parse `cargo metadata` JSON output.
# Only a dev-dependency; never compiled into the contract WASM.
serde_json = { version = "1.0.140", default-features = false, features = ["std"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
